<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小数マスター：全モード双方向</title>
    <style>
        :root { --p: #ff5e78; --s: #4db8ff; --a: #ffd32a; --bg: #fff9e6; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: var(--bg); text-align: center; margin: 0; padding: 10px; }
        #app { max-width: 500px; min-height: 85vh; margin: 10px auto; background: white; border-radius: 40px; border: 8px solid #555; position: relative; display: flex; flex-direction: column; box-shadow: 0 15px 0 #ccc; padding-bottom: 20px; }
        #status-bar { display: flex; justify-content: space-around; padding: 15px; background: #eee; border-radius: 30px 30px 0 0; font-weight: bold; }
        .score-val { color: var(--p); font-size: 24px; }
        #menu { padding: 20px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .mode-btn { width: 90%; padding: 20px; font-size: 20px; border-radius: 20px; border: none; cursor: pointer; color: white; transition: 0.2s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); font-weight: bold; }
        .btn-juice { background: #ff9f43; }
        .btn-ruler { background: #4db8ff; }
        .btn-monster { background: #a29bfe; }
        #game { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .q-text { font-size: 30px; font-weight: bold; margin: 25px 0; color: #333; line-height: 1.5; }
        input { font-size: 40px; width: 150px; border: 5px solid #ddd; border-radius: 20px; text-align: center; outline: none; margin-bottom: 20px; }
        .shake { animation: shake 0.4s; }
        @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
        .bounce { animation: bounce 0.5s; }
        @keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
        .submit-btn { background: var(--p); color: white; border: none; padding: 15px 40px; font-size: 22px; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 0 #d64545; }
        .back-btn { margin-top: 30px; background: #999; color: white; border: none; padding: 8px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <div id="status-bar">
        <div>⭐ほし: <span id="score" class="score-val">0</span></div>
        <div id="rank-display" style="font-size: 14px; align-self: center;">ランク: 見習い</div>
    </div>

    <div id="menu">
        <h2 style="margin: 10px 0;">どっちの特訓にする？</h2>
        <button class="mode-btn btn-juice" onclick="startMode('juice')">🍹 ジュース屋さん<br><small>(L ⇔ dL どっちも！)</small></button>
        <button class="mode-btn btn-ruler" onclick="startMode('ruler')">📏 ものさし探偵<br><small>(cm ⇔ mm どっちも！)</small></button>
        <button class="mode-btn btn-monster" onclick="startMode('monster')">👾 0.1モンスター<br><small>(こすう ⇔ 小数 どっちも！)</small></button>
    </div>

    <div id="game">
        <div id="mode-title" style="font-weight: bold; font-size: 20px; border-bottom: 3px solid #eee; padding-bottom: 5px;"></div>
        <div class="q-text" id="q-text"></div>
        <div>
            <input type="number" id="ans" step="any" placeholder="?">
            <span id="unit" style="font-size: 24px; font-weight: bold;"></span>
        </div>
        <button class="submit-btn" onclick="check()">こたえ合わせ！</button>
        <div id="msg" style="height: 30px; margin-top: 15px; font-weight: bold; color: var(--p);"></div>
        <button class="back-btn" onclick="goToMenu()">メニューにもどる</button>
    </div>
</div>

<script>
    let score = 0;
    let currentMode = '';
    let correctValue = 0;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    function startMode(mode) {
        currentMode = mode;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('game').style.display = 'flex';
        nextQuestion();
    }

    function goToMenu() {
        document.getElementById('menu').style.display = 'flex';
        document.getElementById('game').style.display = 'none';
    }

    function nextQuestion() {
        const d1 = Math.floor(Math.random() * 10);
        const d2 = Math.floor(Math.random() * 10);
        const valDec = parseFloat(`${d1}.${d2}`);
        const valInt = d1 * 10 + d2;
        const isRev = Math.random() > 0.5;

        const input = document.getElementById('ans');
        const title = document.getElementById('mode-title');
        const text = document.getElementById('q-text');
        const unit = document.getElementById('unit');

        input.value = ''; input.focus();
        document.getElementById('msg').innerText = '';

        if (currentMode === 'juice') {
            title.innerText = "🍹 ジュース屋さん";
            title.style.color = "#ff9f43";
            if (!isRev) {
                text.innerHTML = `${valDec} L は<br>何 dL かな？`;
                correctValue = valInt; unit.innerText = " dL";
            } else {
                text.innerHTML = `${valInt} dL は<br>何 L かな？`;
                correctValue = valDec; unit.innerText = " L";
            }
        } else if (currentMode === 'ruler') {
            title.innerText = "📏 ものさし探偵";
            title.style.color = "#4db8ff";
            if (!isRev) {
                text.innerHTML = `${valInt} mm は<br>何 cm かな？`;
                correctValue = valDec; unit.innerText = " cm";
            } else {
                text.innerHTML = `${valDec} cm は<br>何 mm かな？`;
                correctValue = valInt; unit.innerText = " mm";
            }
        } else {
            title.innerText = "👾 0.1モンスター";
            title.style.color = "#a29bfe";
            if (!isRev) {
                text.innerHTML = `${valDec} のなかに<br>0.1 は 何こ ある？`;
                correctValue = valInt; unit.innerText = " こ";
            } else {
                text.innerHTML = `0.1 を<br>${valInt} こ あつめると？`;
                correctValue = valDec; unit.innerText = "";
            }
        }
    }

    function check() {
        const userAns = parseFloat(document.getElementById('ans').value);
        const app = document.getElementById('app');
        const msg = document.getElementById('msg');

        if (Math.abs(userAns - correctValue) < 0.01) {
            score++;
            playSound(523.25, 'sine', 0.2); setTimeout(() => playSound(659.25, 'sine', 0.2), 100);
            app.classList.add('bounce');
            msg.innerText = "⭕ せいかい！！";
            
            if(score >= 50) document.getElementById('rank-display').innerText = "ランク: 👑 小数大王";
            else if(score >= 20) document.getElementById('rank-display').innerText = "ランク: 💎 小数名人";
            else if(score >= 5) document.getElementById('rank-display').innerText = "ランク: 🌟 小数見習い卒業";

            setTimeout(() => {
                app.classList.remove('bounce');
                nextQuestion();
            }, 1000);
        } else {
            playSound(110, 'sawtooth', 0.3);
            app.classList.add('shake');
            msg.innerText = "❌ おしい！もう一回！";
            setTimeout(() => app.classList.remove('shake'), 400);
        }
        document.getElementById('score').innerText = score;
    }

    document.getElementById('ans').addEventListener('keypress', (e) => { if (e.key === 'Enter') check(); });
</script>

</body>
</html>
